name: Sync Facebook Posts

on:
  schedule:
    # 每小時第 37 分檢查，單次排程延遲不再錯過一整天。
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      audit_only:
        description: "僅核對 Facebook 與網站文章，不寫入或提交"
        type: boolean
        default: false

concurrency:
  group: facebook-post-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run sync script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SYNC_AUDIT_ONLY: ${{ inputs.audit_only || 'false' }}
          FB_SYNC_RESULT_PATH: ${{ runner.temp }}/fb-sync-result.json
        run: node scripts/sync-fb-posts.js

      - name: Verify published articles
        if: ${{ inputs.audit_only != true }}
        env:
          FB_SYNC_RESULT_PATH: ${{ runner.temp }}/fb-sync-result.json
        run: node scripts/verify-fb-publication.js

      # 公開 repo 若 60 天沒有活動，GitHub 會自動停用排程。
      # 每月更新一次心跳檔，避免 FB 同步再次進入 disabled_inactivity。
      - name: Keep scheduled sync active
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          month="$(date -u +%Y-%m)"
          heartbeat=".github/fb-sync-heartbeat"
          current="$(cat "$heartbeat" 2>/dev/null || true)"

          if [ "$current" = "$month" ]; then
            echo "Heartbeat already current: $month"
            exit 0
          fi

          printf '%s\n' "$month" > "$heartbeat"
          git config user.name "FB Sync Bot"
          git config user.email "bot@noreply.github.com"
          git add "$heartbeat"
          git commit -m "chore: keep Facebook sync active ($month)"
          git pull --rebase origin master
          git push origin master
